name: Sanitizers

# The core built with AddressSanitizer (make DEBUG_ASAN=1) and with
# UndefinedBehaviorSanitizer (make DEBUG_UBSAN=1), each running the test
# disc's frames on Vulkan (lavapipe) on every renderer, at 24-bit and with
# the HDR output, the recompiler on: any report fails the run
# (tools/vulkan/vk_sanitize.sh). And with AddressSanitizer, the core
# unloaded after its frames with OpenGL and the process ended, with nothing
# left over for LeakSanitizer (tools/threads/unload_leaks.sh).

on:
  push:
    paths:
      - 'core/**'
      - 'tools/threads/unload_leaks.sh'
      - 'tools/gl/gl_frames.c'
      - 'tools/vulkan/vk_sanitize.sh'
      - 'tools/vulkan/vk_hdr.c'
      - 'tools/hdr/hdr_post_ref.*'
      - 'tools/threads/live_disc.py'
      - 'Makefile*'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tools/threads/unload_leaks.sh'
      - 'tools/gl/gl_frames.c'
      - 'tools/vulkan/vk_sanitize.sh'
      - 'tools/vulkan/vk_hdr.c'
      - 'tools/hdr/hdr_post_ref.*'
      - 'tools/threads/live_disc.py'
      - 'Makefile*'
      - '.github/workflows/sanitizers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan (lavapipe) and Mesa's EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev mesa-vulkan-drivers libvulkan1 python3 \
            libegl1-mesa-dev libgl1-mesa-dri
      - name: Build the core with the sanitizer
        run: |
          if [ "${{ matrix.sanitizer }}" = address ]; then
            make -j"$(nproc)" DEBUG_ASAN=1
          else
            make -j"$(nproc)" DEBUG_UBSAN=1
          fi
      - name: Frames on every renderer, 24-bit and HDR
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json SANITIZE=${{ matrix.sanitizer }} sh tools/vulkan/vk_sanitize.sh
      - name: The core unloaded, nothing left over (LeakSanitizer)
        if: matrix.sanitizer == 'address'
        run: sh tools/threads/unload_leaks.sh
