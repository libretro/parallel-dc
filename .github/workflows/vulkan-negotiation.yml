permissions:
  contents: read

jobs:
  vulkan-negotiation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan (lavapipe, validation layer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev mesa-vulkan-drivers vulkan-validationlayers libvulkan1 \
            glslang-tools mingw-w64 wine wine64 xvfb libegl1-mesa-dev libgl1-mesa-dri clang libgles-dev
      - name: The OpenGL renderers as macOS, the Switch and GLES=1 compile them
        run: sh tools/gl/gl_shapes.sh
      - name: Build the core
        run: make -j"$(nproc)"
      - name: Negotiation v2 and v1
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_negotiate.sh
      - name: Renders to textures - what is fetched off the card, when, and what a DMA over them leaves
        run: |
          sh tools/rend/rtt_watch_test.sh
          sh tools/rend/tex_pool_test.sh
          VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_dma.sh
          sh tools/gl/gl_dma.sh
      - name: Polygons drawn outside a clipping rectangle, with OpenGL and OpenGL ES (each renderer)
        run: sh tools/gl/gl_clip.sh
      - name: Textures of one channel (fog table, paletted indices), OpenGL ES 2 and 3, OpenGL 2 and 3+
        run: sh tools/gl/gl_channels.sh
      - name: OpenGL - nothing compiled on the draw path, cold, OpenGL ES 2 and 3, OpenGL 2 and 3+, the general programs' pictures (AGENTS.md)
        run: |
          # (the built core again, every polygon drawn with the general programs: gles.cpp and the link)
          cp -a . "$RUNNER_TEMP/general"
          sed -i '1i #define GL_PROGRAM_TEST_GENERAL' "$RUNNER_TEMP/general/core/rend/gles/gles.cpp"
          make -j"$(nproc)" -C "$RUNNER_TEMP/general"
          GENERAL="$RUNNER_TEMP/general/parallel_dc_libretro.so" sh tools/gl/gl_draw_path.sh
      - name: A state saved while a render to a texture is on the card, every frame run ahead (OpenGL and OpenGL ES)
        run: sh tools/gl/gl_ahead.sh
      - name: The translucent sorter's sort (radix, stable, as a sort by <)
        run: sh tools/rend/sort_pairs_test.sh
      - name: The texture cache's map (room made at the start, the textures never moved), against a plain list
        run: sh tools/rend/tex_map_test.sh
      - name: The Vulkan renderers compiled for 32-bit Windows (a Vulkan handle an integer there)
        run: sh tools/vulkan/vk_i686.sh
      - name: Direct3D 12's polygon blends, the factors folded into the shader, against the PowerVR's (wine, no device)
        run: sh tools/rend/dx12_blend_fold_test.sh
      - name: The frame parsed where the card reads it, not copied (the arena's slices; the pictures those of a copy)
        run: |
          sh tools/rend/parse_arena_test.sh
          VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_parse_arena.sh
          sh tools/gl/gl_parse_arena.sh
      - name: The temporal upscaler's side in the core (strips matched, the request, the inputs)
        run: sh tools/rend/upscaler_test.sh
      - name: The renderers' tests run by hand before (texture converters and cache, GPU decode, tiles, GPU TA processing, and the rest)
        run: |
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          for t in bg_plane oit_bands depth oit_depth speckle ssaa_rules upload_layout xform texconv texdecode; do
            sh tools/rend/${t}_test.sh
          done
          mkdir -p "$RUNNER_TEMP/plain"
          python3 tools/threads/live_disc.py "$RUNNER_TEMP/plain/plain.gdi" > /dev/null
          sh tools/rend/tile_test.sh "$RUNNER_TEMP/plain/plain.gdi" 30
          sh tools/pvr/ta_gpu_test.sh "$RUNNER_TEMP/plain/plain.gdi" 30
          sh tools/pvr/ta_gpu_test_d3d11.sh "$RUNNER_TEMP/plain/plain.gdi" 30
          sh tools/pvr/ta_gpu_test_d3d12.sh "$RUNNER_TEMP/plain/plain.gdi" 30
      - name: Vulkan - nothing made on the draw path, cold, every renderer, without the dynamic states, HDR (AGENTS.md)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_draw_path.sh
      - name: Vulkan - no allocation during play but the listed ones, every renderer (AGENTS.md)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_allocs.sh
      - name: OpenGL - no allocation during play but the listed ones, every renderer, OpenGL ES 3 too (AGENTS.md)
        run: sh tools/gl/gl_allocs.sh
      - name: Vulkan - renders to textures with the screen's attachments, no video memory of their own, black past them
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_vram.sh
      - name: HDR output (HDR10, scRGB, each renderer, every Display Transform)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/vk_hdr.sh
      - name: HDR output's HLSL against its GLSL
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/vulkan/hdr_hlsl.sh
      - name: HDR output's DXBC and DXIL are their sources' (sums), the compute kernels' bindings
        run: |
          sh tools/rend/kernels_dxbc.sh check
          sh tools/rend/kernels_dx12.sh check
          sh tools/rend/kernels_dx12.sh bindings
      - name: HDR output with Direct3D 11 and 12 (wine, the core's encoders, against the GLSL)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/hdr/hdr_d3d.sh
      - name: ACES 2.0 (Full)'s cube baked off the frame (threads, TSan, ASan/UBSan, no threads)
        run: |
          sh tools/hdr/hdr_cube.sh
          SANITIZE=thread sh tools/hdr/hdr_cube.sh
          SANITIZE=address,undefined UBSAN_OPTIONS=halt_on_error=1 sh tools/hdr/hdr_cube.sh

  d3d11-hdr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64, wine and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential mingw-w64 wine wine64 xvfb mesa-vulkan-drivers libvulkan1 python3
      - name: Build the core for Windows
        run: make -j"$(nproc)" platform=win CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - name: HDR output with Direct3D 11 and 12 (24-bit, refused, HDR10, scRGB, each renderer)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/hdr/d3d_hdr.sh parallel_dc_libretro.dll
      - name: Direct3D 11 - video memory written by DMA over renders to textures (Direct3D 12 with D3D12_DLLS)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/d3d_dma.sh parallel_dc_libretro.dll
      - name: Direct3D 12 drawing the frame from where it is parsed, every frame the one of the lists copied
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/d3d_parse_arena.sh parallel_dc_libretro.dll
      - name: Direct3D 12's shaders as DXIL where the device takes shader model 6.0, as DXBC where it does not
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/d3d_dxil.sh parallel_dc_libretro.dll
      - name: Direct3D 11 - nothing compiled or made on the draw path, cold, every renderer (AGENTS.md)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/d3d_draw_path.sh parallel_dc_libretro.dll
      - name: Direct3D 11 and 12 - no allocation during play, every renderer (AGENTS.md)
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/d3d_allocs.sh parallel_dc_libretro.dll
      - name: The Direct3D renderers' thread ahead and their shader file (TSan, ASan/UBSan, no threads, Windows), and the band pool on Windows
        run: |
          sh tools/rend/d3d_warm_test.sh
          WINDOWS=1 sh tools/rend/d3d_warm_test.sh
          WINDOWS=1 sh tools/rend/band_pool_test.sh
      - name: Direct3D 11's shaders made ahead and kept on disk, on a device
        run: sh tools/rend/dx11_shaders_ahead_test.sh
      - name: Direct3D 12's pipelines made ahead, on a device
        run: VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json sh tools/rend/dx12_pipelines_ahead_test.sh
