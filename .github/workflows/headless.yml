name: Headless

# The live test's disc on the core with no display and no GPU: headless.c
# for a frontend and an OpenGL that does nothing (headless_gl.py). The
# program's verdicts on itself, its sound sample for sample, both SH4
# timings and the MMU, states saved and loaded and every frame run ahead
# (each the same, byte for byte, as the frames run straight), code that
# rewrites itself, a NAOMI cartridge and romsets: tools/threads/headless.sh;
# and again on a build with the interpreter alone, as iOS's is, and on one
# for a processor with no recompiler, RISC-V 64 under qemu
# (tools/threads/generic_cpu.sh).
# And a strip's indices, the parse's C89 kernel, against the loop it
# replaced (tools/pvr/ta_index_test.sh); and the parse timed on the heavy
# disc, the strips its vertex loop found drawable whole making the indices
# a look at their vertices does (tools/pvr/ta_parse_bench.sh). And the beam
# each read of SPG_STATUS sees, kept from the read before on its line,
# against the beam found afresh (tools/pvr/spg_beam_test.sh). And the
# register allocator's lists against the std::set they replace
# (tools/sh4/reglist_test.sh), and the recompilers' pool, pieces taken and
# given back at random (tools/sh4/node_pool_test.sh). And the recompilers
# against the interpreters, each built alone with the assembler they share
# (tools/sh4/run.sh, tools/arm7/run.sh, tools/aica/run.sh), the
# interpreter's FMAC against fmaf() (tools/sh4/fmac_test.sh), the opcode
# table as it always was (tools/sh4/opcode_table_run.sh), and the sound
# chip's channels against what they made before (tools/aica/sgc_run.sh), and
# the G2 bus's expansion DMA channels (tools/aica/g2dma_run.sh), and the
# broadband adapter, a frame each way and its state (tools/bba/run.sh), and
# NAOMI's 315-5881 decryption against what it gave before
# (tools/naomi/decrypt_run.sh), the ELF reader (tools/libelf/elf_test.sh),
# the NAOMI's X76F100 serial flash (tools/flashrom/x76f100_run.sh), and the
# modem's DNS queries and the answers it reads (tools/modem/dns_run.sh), and
# Dinosaur King's card codec against what it made before
# (tools/naomi/dinokich_card_run.sh), and the paths the core writes to, a
# content's name of any length included (tools/paths/paths_run.sh), and the
# HLE BIOS's GD-ROM transfers stopped at a fault and made again
# (tools/reios/gdrom_hle_run.sh), and the games' fixes and widescreen
# cheats (tools/cheats/cheats_run.sh).
# And the threads a texture scaled up is shared out to, and the core needing
# no OpenMP runtime (tools/rend/band_pool_test.sh). And custom textures'
# pictures, read as stb_image read them and dumped
# (tools/rend/custom_image_test.sh),
# the textures' hashes as XXH32 made them (tools/rend/texhash_test.sh), and
# the modem's UPnP against a gateway on the runner (tools/threads/upnp_test.sh).

on:
  push:
    paths:
      - 'core/**'
      - 'tools/threads/headless*'
      - 'tools/threads/live_*'
      - 'tools/pvr/ta_index_test.*'
      - 'tools/pvr/ta_parse_bench.*'
      - 'tools/sh4/reglist_test.*'
      - 'tools/sh4/node_pool_test.*'
      - 'tools/rend/band_pool_test.*'
      - 'tools/rend/custom_image*'
      - 'tools/rend/texhash_test.*'
      - 'tools/threads/upnp_*'
      - 'tools/threads/**'
      - 'tools/unused_sources.py'
      - 'tools/c89/**'
      - 'tools/sh4/run.sh'
      - 'tools/sh4/fmac_test.*'
      - 'tools/sh4/vector_test.cpp'
      - 'tools/arm7/**'
      - 'tools/aica/**'
      - 'tools/bba/**'
      - 'tools/naomi/**'
      - 'tools/libelf/**'
      - 'tools/flashrom/**'
      - 'tools/modem/**'
      - 'tools/paths/**'
      - 'tools/reios/**'
      - 'tools/cheats/**'
      - 'tools/log/**'
      - 'tools/sh4/opcode_table_*'
      - 'Makefile*'
      - '.github/workflows/headless.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tools/threads/headless*'
      - 'tools/threads/live_*'
      - 'tools/pvr/ta_index_test.*'
      - 'tools/pvr/ta_parse_bench.*'
      - 'tools/sh4/reglist_test.*'
      - 'tools/sh4/node_pool_test.*'
      - 'tools/rend/band_pool_test.*'
      - 'tools/rend/custom_image*'
      - 'tools/rend/texhash_test.*'
      - 'tools/threads/upnp_*'
      - 'tools/threads/**'
      - 'tools/unused_sources.py'
      - 'tools/c89/**'
      - 'tools/sh4/run.sh'
      - 'tools/sh4/fmac_test.*'
      - 'tools/sh4/vector_test.cpp'
      - 'tools/arm7/**'
      - 'tools/aica/**'
      - 'tools/bba/**'
      - 'tools/naomi/**'
      - 'tools/libelf/**'
      - 'tools/flashrom/**'
      - 'tools/modem/**'
      - 'tools/paths/**'
      - 'tools/reios/**'
      - 'tools/cheats/**'
      - 'tools/log/**'
      - 'tools/sh4/opcode_table_*'
      - 'Makefile*'
      - '.github/workflows/headless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler and OpenGL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgl1-mesa-dev python3 gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
      - name: Build the core
        run: make -j"$(nproc)"
      - name: Nothing built that the core does not use, and no libretro-common it does not
        run: python3 tools/unused_sources.py
      - name: The core's C as MSVC C89 takes it (AGENTS.md), and the headers it includes
        run: sh tools/c89/c89_check.sh
      - name: No variable of the C files declared with C++ linkage, which MSVC does not link
        run: python3 tools/c89/linkage_check.py
      - name: Every line the core logs ends with its own newline (log_cb adds none)
        run: python3 tools/log/log_check.py
      - name: The disc with no display, its states and run-ahead among it
        run: sh tools/threads/headless.sh parallel_dc_libretro.so
      - name: The same with the interpreter alone, as a build with no recompiler has it (iOS); the SH4's exceptions caught by sh4_catch
        run: |
          D=${RUNNER_TEMP:-/tmp}/interp
          git worktree add --detach "$D"
          make -C "$D" -j"$(nproc)" WITH_DYNAREC= HAVE_GENERIC_JIT=0 NO_REC=1 'HOST_CPU_FLAGS=-DHOST_CPU=$(HOST_CPU_X64)'
          WORK=${RUNNER_TEMP:-/tmp}/interp-work sh tools/threads/headless.sh "$D/parallel_dc_libretro.so"
          git worktree remove --force "$D"
      - name: The threads a texture scaled up is shared out to (TSan, ASan/UBSan, no threads), and no OpenMP in the core
        run: sh tools/rend/band_pool_test.sh parallel_dc_libretro.so
      - name: Custom textures' pictures (PNG, JPEG) read as stb_image read them, cut and spoilt, dumped and read back (ASan/UBSan; AArch64)
        run: |
          sh tools/rend/custom_image_test.sh
          CC="aarch64-linux-gnu-gcc -static" RUN=qemu-aarch64-static sh tools/rend/custom_image_test.sh
      - name: The textures' hashes (custom textures' names) as XXH32 made them
        run: sh tools/rend/texhash_test.sh
      - name: The modem's UPnP against a gateway on the runner (found, TCP and UDP mapped and deleted; none found without)
        run: sh tools/threads/upnp_test.sh
      - name: The threads' tests, built against the core's own sources (the lock-free handoffs, the save writer, the modem and the NAOMI network)
        run: sh tools/threads/run.sh
      - name: A strip's indices (C89, ASan and UBSan; SIMD, scalar and NEON) against the loop they replaced
        run: NEON=required sh tools/pvr/ta_index_test.sh
      - name: The parse timed on the heavy disc, the strips known good making the indices a look at them does
        run: sh tools/pvr/ta_parse_bench.sh
      - name: The beam kept from read to read of SPG_STATUS against the beam found afresh, straight and run ahead
        run: sh tools/pvr/spg_beam_test.sh
      - name: The register allocator's lists against the std::set they replace, the same order
        run: sh tools/sh4/reglist_test.sh
      - name: The recompilers' pool (blocks, their lists, the labels), pieces taken and given back
        run: sh tools/sh4/node_pool_test.sh
      - name: The interpreter's FMAC, a * b + c rounded once without fmaf(), against fmaf() rounding both ways the SH4 does (and ARM64's own, under qemu)
        run: sh tools/sh4/fmac_test.sh
      - name: The SH4 opcode table, what each opcode is said to be, as it always was (and with the sanitizers)
        run: |
          sh tools/sh4/opcode_table_run.sh
          sh tools/sh4/opcode_table_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The recompilers against the interpreters, built alone with Xbyak (the SH-4's vectors, the sound chip's ARM7 and DSP)
        run: |
          sh tools/sh4/run.sh
          sh tools/arm7/run.sh
          sh tools/aica/run.sh
      - name: The sound chip's channels, the same sound as the C++ ones they replace (and with the sanitizers)
        run: |
          sh tools/aica/sgc_run.sh
          sh tools/aica/sgc_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The G2 bus's expansion DMA channels, each its own (and with the sanitizers)
        run: |
          sh tools/aica/g2dma_run.sh
          sh tools/aica/g2dma_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The broadband adapter, a frame each way and its state (and with the sanitizers)
        run: |
          sh tools/bba/run.sh
          sh tools/bba/run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: NAOMI's 315-5881 decryption, the same streams as the C++ it replaces, and its state (and with the sanitizers)
        run: |
          sh tools/naomi/decrypt_run.sh
          sh tools/naomi/decrypt_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: Dinosaur King's card codec, as it always was (and with the sanitizers)
        run: |
          sh tools/naomi/dinokich_card_run.sh
          sh tools/naomi/dinokich_card_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The paths the core writes to, a content's name of any length (and with the sanitizers)
        run: |
          sh tools/paths/paths_run.sh
          sh tools/paths/paths_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The HLE BIOS's GD-ROM transfers, one stopped at a fault made again as it was (and with the sanitizers)
        run: |
          sh tools/reios/gdrom_hle_run.sh
          sh tools/reios/gdrom_hle_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The games' fixes and widescreen cheats, which game gets which and what goes back (and with the sanitizers)
        run: |
          sh tools/cheats/cheats_run.sh
          sh tools/cheats/cheats_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The ELF reader, an SH-4 executable's headers every way they are read (C89, ASan/UBSan)
        run: sh tools/libelf/elf_test.sh
      - name: The NAOMI's X76F100 serial flash, its protocol and its state, and lines at random as before (and with the sanitizers)
        run: |
          sh tools/flashrom/x76f100_run.sh
          sh tools/flashrom/x76f100_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all
      - name: The modem's DNS queries, and answers cut short or lying about their lengths (and with the sanitizers)
        run: |
          sh tools/modem/dns_run.sh
          sh tools/modem/dns_run.sh -fsanitize=address,undefined -fno-sanitize-recover=all

  generic-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the RISC-V cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user-static python3 libgl1-mesa-dev
      - name: A processor with no recompiler (RISC-V 64, under qemu) - built as make ARCH=riscv64 has it, every symbol there, and the disc run on it
        run: sh tools/threads/generic_cpu.sh
